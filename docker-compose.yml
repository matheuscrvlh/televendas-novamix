services:
  server:
    build: ./server
    container_name: televendas-server
    ports:
      - "3009:3000"
    env_file:
      - ./server/.env
    environment:
      SERVER_PORT: "3000"
    volumes:
      - server_uploads:/app/uploads
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL:?Defina a variável VITE_API_URL antes de buildar}
    container_name: televendas-client
    ports:
      - "8089:80"
    restart: unless-stopped

volumes:
  server_uploads:
